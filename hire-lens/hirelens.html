<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireLens · 招聘决策工作台</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#0b0f17; --panel:#121826; --panel2:#161e2e; --line:#22304a; --line2:#2c3c5c;
  --tx:#e7eef9; --sub:#93a1b8; --dim:#6b7a94;
  --ac:#4f8cff; --ac2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --purple:#a78bfa;
  --r:12px; --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#app{display:flex;height:100vh;overflow:hidden}
/* ---------- 侧栏 ---------- */
#side{width:212px;min-width:212px;background:linear-gradient(180deg,#0d1320,#0a0e17);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f;font-size:17px;box-shadow:0 4px 16px rgba(79,140,255,.4)}
.logo b{font-size:16px;letter-spacing:.5px}
.logo small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--sub);cursor:pointer;border:1px solid transparent;background:none;font-size:14px;text-align:left;width:100%}
.navbtn:hover{background:#182238;color:var(--tx)}
.navbtn.on{background:linear-gradient(90deg,rgba(79,140,255,.16),rgba(34,211,238,.08));color:var(--tx);border-color:rgba(79,140,255,.35)}
.navbtn .ico{width:18px;text-align:center;opacity:.9}
.side-foot{margin-top:auto;font-size:11px;color:var(--dim);padding:10px;line-height:1.7;border-top:1px solid var(--line)}
/* ---------- 主区 ---------- */
#main{flex:1;overflow-y:auto;padding:26px 30px 80px;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
h2{font-size:18px;font-weight:650;margin:0 0 12px}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.pghead{margin-bottom:22px}
.pghead p{color:var(--sub);font-size:13px}
/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card.tight{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{color:var(--dim);font-size:12px;line-height:1.7}
.warnbox{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#fde68a;margin:10px 0}
.errbox{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.4);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#fecaca;margin:10px 0}
.okbox{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.35);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#a7f3d0;margin:10px 0}
/* ---------- 按钮/输入 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);cursor:pointer;font-size:13.5px;transition:.15s}
.btn:hover{border-color:var(--ac);background:#1a2440}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--ac),#3b6fe0);border-color:transparent;color:#fff;font-weight:600}
.btn-p:hover{filter:brightness(1.12);background:linear-gradient(135deg,var(--ac),#3b6fe0)}
.btn-ok{background:linear-gradient(135deg,#0ea371,#34d399);border-color:transparent;color:#04120c;font-weight:600}
.btn-ok:hover{filter:brightness(1.1)}
.btn-d{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.45);color:#fca5a5}
.btn-d:hover{background:rgba(248,113,113,.22);border-color:var(--bad)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn-xs{padding:2px 8px;font-size:11.5px;border-radius:6px}
input[type=text],input[type=password],input[type=number],input[type=email],input[type=date],select,textarea{
  background:#0d1420;border:1px solid var(--line2);color:var(--tx);border-radius:9px;padding:8px 12px;font-size:13.5px;outline:none;width:100%;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:90px;line-height:1.7}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.switch{position:relative;width:38px;height:21px;background:#26334d;border-radius:20px;cursor:pointer;transition:.2s;flex:none}
.switch.on{background:var(--ok)}
.switch::after{content:'';position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:19px}
/* ---------- 徽章 ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;border:1px solid;white-space:nowrap}
.b-blue{color:#93c5fd;border-color:rgba(147,197,253,.4);background:rgba(59,130,246,.12)}
.b-green{color:#6ee7b7;border-color:rgba(110,231,183,.4);background:rgba(16,185,129,.12)}
.b-yellow{color:#fcd34d;border-color:rgba(252,211,77,.4);background:rgba(245,158,11,.12)}
.b-red{color:#fca5a5;border-color:rgba(252,165,165,.45);background:rgba(239,68,68,.12)}
.b-gray{color:var(--sub);border-color:var(--line2);background:#1a2233}
.b-purple{color:#c4b5fd;border-color:rgba(196,181,253,.4);background:rgba(139,92,246,.12)}
/* ---------- 表格 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--sub);font-weight:550;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:#141c2c}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:rgba(79,140,255,.04)}
.tbl input,.tbl select{padding:5px 8px;font-size:12.5px;min-width:90px}
.tbl textarea{min-height:54px;font-size:12.5px}
/* ---------- 步骤条 ---------- */
.steps{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.step{padding:7px 14px;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;border:1px solid transparent;white-space:nowrap}
.step:hover{color:var(--tx)}
.step.on{background:linear-gradient(90deg,rgba(79,140,255,.2),rgba(34,211,238,.1));color:var(--tx);border-color:rgba(79,140,255,.4)}
.step.done{color:var(--ok)}
/* ---------- 进度条/分数条 ---------- */
.pbar{height:8px;background:#1a2336;border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .4s}
.sbar{display:flex;align-items:center;gap:8px;margin:4px 0}
.sbar .nm{width:120px;min-width:120px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .pbar{flex:1}
.sbar .vv{width:44px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
/* ---------- 任务卡片 ---------- */
.tcard{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;cursor:pointer;transition:.15s}
.tcard:hover{border-color:var(--ac);transform:translateY(-1px)}
.tcard .tname{font-weight:600;font-size:15px}
.tcard .tmeta{color:var(--dim);font-size:12px;margin-top:2px}
.tprog{width:180px}
/* ---------- 首页引导 ---------- */
.hero{background:linear-gradient(135deg,rgba(79,140,255,.14),rgba(34,211,238,.06)),var(--panel);border:1px solid rgba(79,140,255,.35);border-radius:16px;padding:30px 32px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 70%)}
.onb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
@media(max-width:860px){.onb{grid-template-columns:1fr}}
.onb .o{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.onb .o .n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121f;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:8px}
.onb .o b{display:block;margin-bottom:4px;font-size:13.5px}
.onb .o span{color:var(--sub);font-size:12px;line-height:1.7}
/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:860px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.modal .mx{cursor:pointer;color:var(--dim);font-size:18px;padding:0 4px}
.modal .mx:hover{color:var(--tx)}
/* ---------- Toast ---------- */
#toastRoot{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--ac);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow);animation:tin .25s;max-width:380px}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
/* ---------- 其他 ---------- */
mark{background:rgba(251,191,36,.3);color:#fde68a;border-radius:3px;padding:0 2px}
.quote{background:#0d1420;border:1px solid var(--line);border-left:3px solid var(--ac2);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--sub);margin:6px 0;cursor:pointer;line-height:1.7}
.quote:hover{border-left-color:var(--ac);color:var(--tx)}
.orig{background:#0a0f1a;border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap;max-height:420px;overflow-y:auto;color:#c9d5e8}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;color:var(--sub);cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--ac);background:rgba(79,140,255,.06)}
.kv{display:flex;gap:10px;font-size:12.5px;margin:4px 0}
.kv b{color:var(--sub);min-width:90px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2b3b5e,#1a2440);display:flex;align-items:center;justify-content:center;font-size:13px;color:#9db4dd;flex:none;border:1px solid var(--line2)}
.nullflag{color:var(--warn);font-size:11.5px}
.tabsm{font-size:12px;color:var(--dim)}
.lc-note{font-size:11px;color:var(--warn)}
.grp-head{padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#243149;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="logo">
      <div class="mark">H</div>
      <div><b>HireLens</b><small>招聘决策工作台</small></div>
    </div>
    <button class="navbtn" data-nav="home" onclick="go('home')"><span class="ico">⌂</span>首页</button>
    <button class="navbtn" data-nav="tasks" onclick="go('tasks')"><span class="ico">▦</span>招聘任务</button>
    <button class="navbtn" data-nav="archive" onclick="go('archive')"><span class="ico">🗄</span>归档</button>
    <button class="navbtn" data-nav="settings" onclick="go('settings')"><span class="ico">⚙</span>设置与状态</button>
    <div class="side-foot">演示环境 · 无真实模型调用<br>示例数据均为<b style="color:var(--warn)">合成</b><br>隐私：邮箱/授权码加密存储</div>
  </aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
/* =====================================================
   HireLens 招聘决策工作台 —— 单文件演示实现
   说明：本环境无真实大模型，JD 解析 / 简历评分 / 综合评估
   均由本地启发式引擎（关键词抽取 + 证据句检索 + 加权计分）
   真实计算得出，可复现、可解释；会议与邮件为模拟通道。
   ===================================================== */

/* ---------- 工具 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const fmtT = ts => new Date(ts).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
const todayStr = () => new Date().toISOString().slice(0, 10);
function toast(msg, type='') { const d=document.createElement('div'); d.className='toast '+type; d.innerHTML=msg; document.getElementById('toastRoot').appendChild(d); setTimeout(()=>{d.style.opacity=0; d.style.transition='.4s'; setTimeout(()=>d.remove(),400);}, 3400); }
function modal(html, w) { const r=document.getElementById('modalRoot'); r.innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal" style="${w?'max-width:'+w+'px':''}">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function download(name, content, mime='text/plain'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function splitSents(t){ return t.split(/(?<=[。；;！？！\n])/).map(s=>s.trim()).filter(s=>s.length>1); }

/* ---------- 数据层（localStorage 持久化 + 版本校验） ---------- */
const DB_KEY = 'hirelens_db_v1';
let DB = { tasks: [], seq: 1, settings: { smtp: null, cleanupDays: 90, demo: { modelFail:false, searchDown:false, sendTimeout:false } } };
function loadDB(){ try{ const r=localStorage.getItem(DB_KEY); if(r) DB=Object.assign(DB, JSON.parse(r)); }catch(e){ console.warn('DB load fail', e); } }
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ toast('本地存储写入失败：'+e.message,'bad'); } }
function getTask(id){ return DB.tasks.find(t=>t.id===id); }
/* 乐观锁：保存前校验版本，旧版本返回 409 */
function saveTask(task, expectVer){
  const cur = DB.tasks.find(t=>t.id===task.id);
  if(expectVer!=null && cur && cur.ver !== expectVer) return 409;
  if(expectVer!=null && task.ver !== expectVer) return 409;
  task.ver = (task.ver||1) + 1; task.updatedAt = Date.now(); saveDB(); return 200;
}

/* ---------- 脱敏引擎 ---------- */
function maskName(n){ return n ? n[0] + '*'.repeat(n.length-1) : n; }
function desensitize(text){
  const found = { names:[], phones:[], emails:[], ids:0 };
  let t = text;
  t = t.replace(/1[3-9]\d{9}/g, m=>{ found.phones.push(m); return m.slice(0,3)+'****'+m.slice(7); });
  t = t.replace(/[\w.+-]+@[\w-]+\.[\w.]{2,}/g, m=>{ found.emails.push(m); return '***@'+m.split('@')[1]; });
  t = t.replace(/\d{17}[\dXx]/g, ()=>{ found.ids++; return '3101**********0012'; });
  const nm = t.match(/姓\s*名\s*[:：]\s*([\u4e00-\u9fa5]{2,4})/);
  if(nm){ const n=nm[1]; found.names.push(n); t = t.split(n).join(maskName(n)); }
  const nm2 = t.match(/^[\u4e00-\u9fa5]{2,4}(?=\s*[|｜]\s*(?:男|女|\d{2}岁|简历))/m);
  if(nm2 && !found.names.includes(nm2[0])){ found.names.push(nm2[0]); t = t.split(nm2[0]).join(maskName(nm2[0])); }
  return { text: t, found };
}

/* ---------- JD 解析引擎（本地启发式） ---------- */
function parseJD(text){
  const t = text.trim();
  const lines = t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const title = (t.match(/(?:岗位|职位|招聘)\s*[:：]\s*([^\n，,。；]{2,24})/)||[])[1] || (lines[0]||'未命名岗位').slice(0,24);
  const level = (t.match(/(资深|高级|中级|初级|专家|总监|经理|主管|实习生|P[5-9]|L[1-7])/)||[])[1] || '未标注职级';
  const sents = splitSents(t);
  const hard = sents.filter(s=>/(本科|硕士|研究生|博士|学历|\d+\s*年.{0,6}经验|经验|精通|熟练|熟悉|必须|必备|掌握|优先)/.test(s)).slice(0,6);
  const hardReqs = hard.map(s=>{
    const kws = [];
    for(const kw of ['本科','硕士','研究生','博士','大专','3年','5年','2年','1年','10年','SQL','Python','Excel','英语'])
      if(new RegExp(escRe(kw),'i').test(s)) kws.push(kw);
    const tech = s.match(/(熟悉|精通|掌握|熟练)([^，。；、]{1,14})/); if(tech && tech[2] && !kws.includes(tech[2].trim())) kws.push(tech[2].trim().slice(0,10));
    return { id: uid(), text: s.slice(0,80), keywords: kws.length?kws:[s.slice(0,6)], status:'待核实' };
  });
  const soft = sents.filter(s=>/(沟通|协作|责任|学习|抗压|自驱|团队|逻辑|主动)/.test(s)).slice(0,3);
  /* 生成 3-6 个初筛维度（不预置模板，按 JD 内容生成） */
  const dims = [];
  const add = (name, desc, kws) => dims.push({ id:uid(), name, desc, keywords:kws.filter(Boolean), weight:0, min:60, source:'AI建议' });
  const kwsFromJD = re => { const set=new Set(); for(const s of sents){ const m=s.match(re); if(m) set.add(m[0]); } return [...set]; };
  if(/大模型|LLM|GPT|AIGC|人工智能|机器学习|深度学习|AI/i.test(t)) add('AI 应用与模型理解','对大模型能力边界、提示词设计、AI 产品落地的理解程度',['大模型','AI','提示词','Prompt','机器学习','智能体','AIGC']);
  if(/产品|需求|PRD|原型|规划/.test(t)) add('产品核心能力','需求分析、方案设计与产品落地的经验与成果',['产品','需求','PRD','原型','迭代','方案']);
  if(/SQL|数据|分析|指标|BI/i.test(t)) add('数据分析能力','用数据驱动决策的能力，含 SQL 与指标体系',['SQL','数据','分析','指标','报表','A\/B']);
  if(/前端|后端|开发|技术|架构|接口/.test(t)) add('技术理解与落地','对技术方案的判断力与跨端协作落地能力',['技术','开发','接口','架构','API']);
  add('学历与工作经验','硬性学历与年限要求是否满足',['本科','硕士','年']);
  if(/沟通|协作|跨部门|团队/.test(t)) add('沟通与协作','跨团队沟通、推动协作与表达能力',['沟通','协作','跨部门','团队']);
  const prio = sents.filter(s=>/优先/.test(s)).slice(0,2);
  if(prio.length) add('加分项与亮点','JD 中标注优先级的能力或经历（开源、行业、证书等）', prio.map(s=>{const m=s.match(/(有|具备|熟悉)([^，。；]{1,10})/); return m?m[2].trim():'优先';}));
  while(dims.length < 3) add('学习与成长潜力','面向岗位所需新知识的学习速度与自驱力',['学习','研究','总结','自驱']);
  const w = [28,22,18,14,10,8];
  dims.forEach((d,i)=> d.weight = w[i] || 6);
  /* 权重归一到 100 */
  const sw = dims.reduce((a,d)=>a+d.weight,0); dims.forEach(d=>d.weight = Math.round(d.weight*100/sw));
  const diff = 100 - dims.reduce((a,d)=>a+d.weight,0); dims[0].weight += diff;
  return { title, level, hardReqs, soft, dims };
}

/* ---------- 简历评分引擎（本地启发式，逐维度 + 原文引用） ---------- */
function scoreResume(task, cand){
  const text = cand.text || '';
  if(text.replace(/\s/g,'').length < 60){
    cand.scoring = { status:'null', reason:'材料不可读或关键信息缺失（有效内容不足）', error:'NULL_MATERIAL' };
    return;
  }
  if(cand.conflict){
    cand.scoring = { status:'null', reason:'信息冲突：简历中存在互相矛盾的关键陈述，需人工复核后重评', error:'CONFLICT' };
    return;
  }
  if(DB.settings.demo.searchDown){
    cand.scoring = { status:'failed', error:'SEARCH_DOWN', reason:'证据检索服务不可用，无法定位原文引用，已暂停评分' };
    return;
  }
  if(DB.settings.demo.modelFail){
    cand.scoring = { status:'failed', error:'MODEL_FAIL', reason:'评分模型调用失败（模拟），请检查网络后重试' };
    return;
  }
  const sents = splitSents(text);
  const scores = {};
  for(const dim of task.dims){
    const quotes = []; let hits = 0;
    for(const kw of dim.keywords){
      if(!kw) continue;
      const re = new RegExp(escRe(kw),'i');
      const s = sents.find(x=>re.test(x) && !quotes.includes(x));
      if(s){ hits++; quotes.push(s.length>90 ? s.slice(0,90)+'…' : s); }
    }
    const cov = hits / Math.max(1, dim.keywords.length);
    let v, note='';
    if(hits === 0){ v = 10; note = '该维度未检索到直接证据，按证据不足低分处理（非淘汰依据）'; }
    else { v = Math.min(100, Math.round(cov*70 + Math.min(30, hits*7))); if(hits<=1) note='证据较少，建议人工复核原文'; }
    scores[dim.id] = { v, quotes: quotes.slice(0,3), note };
  }
  const valid = task.dims.filter(d=>scores[d.id]);
  const total = Math.round(valid.reduce((a,d)=>a + d.weight*scores[d.id].v, 0) / Math.max(1, valid.reduce((a,d)=>a+d.weight,0)));
  const matchClass = text.length < 220 ? {tag:'材料不足', cls:'b-yellow'}
    : total >= 72 ? {tag:'较匹配', cls:'b-green'} : total >= 50 ? {tag:'部分/可迁移匹配', cls:'b-blue'} : {tag:'低匹配', cls:'b-gray'};
  /* 硬性条件状态 */
  const hardStatus = (task.jdParsed?.hardReqs||[]).map(h=>{
    const found = h.keywords.some(kw=>new RegExp(escRe(kw),'i').test(text));
    const neg = h.keywords.some(kw=>new RegExp('(无|不具备)[^。；]{0,8}'+escRe(kw)).test(text));
    return { text:h.text, status: neg ? '未满足' : found ? '已满足' : '待核实' };
  });
  cand.scoring = { status:'done', reason:'', error:'' };
  cand.scores = scores; cand.total = total; cand.matchClass = matchClass; cand.hardStatus = hardStatus;
}

/* ---------- 后台评分 Worker（可离开页面不中断） ---------- */
let workerState = { running:false, taskId:null, queue:[], current:'' };
function startScoring(taskId){
  const task = getTask(taskId); if(!task) return;
  workerState = { running:true, taskId, queue: task.candidates.filter(c=>['queued','failed','timeout'].includes(c.scoring?.status)).map(c=>c.id), current:'' };
  (function step(){
    if(!workerState.running || !workerState.queue.length){ workerState.running=false; workerState.current=''; saveDB(); render(); return; }
    const task2 = getTask(workerState.taskId); if(!task2){ workerState.running=false; return; }
    const cid = workerState.queue.shift();
    const c = task2.candidates.find(x=>x.id===cid); if(!c){ step(); return; }
    if(c.scoring?.status==='done'){ step(); return; }
    workerState.current = c.nameMasked;
    c.scoring = { status:'running', reason:'', error:'' }; render();
    setTimeout(()=>{
      const t3 = getTask(workerState.taskId); const c3 = t3 && t3.candidates.find(x=>x.id===cid);
      if(!c3){ step(); return; }
      scoreResume(t3, c3);
      if(c3.scoring.status==='running'){ /* 兜底 */ c3.scoring={status:'done'}; }
      saveDB(); render(); step();
    }, 900 + Math.random()*700);
  })();
  saveDB(); render();
}
function retryCandidate(taskId, cid){
  const t=getTask(taskId), c=t&&t.candidates.find(x=>x.id===cid); if(!c) return;
  c.scoring={status:'queued'}; DB.settings.demo.modelFail=false; DB.settings.demo.searchDown=false; saveDB();
  toast('已重置评分状态，开始重试','ok');
  if(!workerState.running) startScoring(taskId);
}

/* 文件解析（真实 PDF/DOCX 解析，库加载失败时降级提示） */
function onFiles(list){
  const files=[...list]; if(!files.length) return;
  if(files.length>10) { toast('每批最多 10 份','warn'); return; }
  const pdfok=!!window.pdfjsLib, docok=!!window.mammoth;
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  files.forEach(f=>{
    const item={name:f.name, status:'run', text:''}; IMP.files.push(item);
    const ext=f.name.split('.').pop().toLowerCase();
    const rd=new FileReader();
    if(ext==='pdf'){
      if(!pdfok){ item.status='err'; item.err='PDF 解析库加载失败（离线？），请改用粘贴正文'; render(); return; }
      rd.onload=async()=>{ try{
        const pdf=await pdfjsLib.getDocument({data:rd.result}).promise;
        let tx=''; for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent(); tx+=c.items.map(x=>x.str).join(' ')+'\n'; }
        item.text=tx; item.status='ok'; render();
      }catch(e){ item.status='err'; item.err='PDF 解析失败：'+e.message; render(); } };
      rd.readAsArrayBuffer(f);
    }else if(ext==='docx'){
      if(!docok){ item.status='err'; item.err='DOCX 解析库加载失败（离线？），请改用粘贴正文'; render(); return; }
      rd.onload=async()=>{ try{ const r=await mammoth.extractRawText({arrayBuffer:rd.result}); item.text=r.value; item.status='ok'; render(); }
      catch(e){ item.status='err'; item.err='DOCX 解析失败：'+e.message; render(); } };
      rd.readAsArrayBuffer(f);
    }else{ item.status='err'; item.err='仅支持 PDF / DOCX'; }
    render();
  });
}
function addCandidates(taskId){
  const t=getTask(taskId); if(!t) return;
  const okFiles=IMP.files.filter(f=>f.status==='ok' && f.text.trim());
  const pastes=(document.getElementById('pasteArea').value||'').split(/\n\s*\n+/).map(s=>s.trim()).filter(s=>s.length>40);
  const texts=[...okFiles.map(f=>({text:f.text, name:f.name})), ...pastes.map(s=>({text:s, name:'粘贴文本'}))];
  if(!texts.length) return toast('请先成功解析文件或粘贴有效正文','warn');
  if(t.candidates.length + texts.length > 30) return toast('超出每任务 30 人上限','warn');
  for(const it of texts){
    const contact=extractContact(it.text);
    const nameM=(it.text.match(/姓\s*名\s*[:：]\s*([\u4e00-\u9fa5]{2,4})/)||[])[1] || it.name.replace(/\.(pdf|docx)$/i,'').slice(0,8) || '未署名';
    const d=desensitize(it.text);
    t.candidates.push({ id:uid(), nameMasked:maskName(nameM), contact, fileName:it.name==='粘贴文本'?'':it.name,
      rawText:it.text, text:d.text, desensFound:d.found, conflict:/目前仍在职|目前在职/.test(it.text)&&/20\d{2}\s*年\s*\d{1,2}\s*月.{0,6}离职/.test(it.text),
      sampleTag:/示例|合成/.test(it.text), scoring:{status:'queued'}, scores:{}, total:null, matchClass:null,
      selected:false, manual:{level:'',note:''}, phone:{num:'',result:'',note:''},
      meeting:{mid:'',link:'',transcript:false}, email:{to:'',subject:'',body:'',date:'',status:'未发送'},
      interview:{text:'',fileName:''}, eval:null, history:[] });
  }
  IMP={files:[],paste:''}; saveDB();
  toast(`已加入 ${texts.length} 位候选人，请确认脱敏结果`,'ok');
  t.status = t.status==='draft' ? 'screening' : t.status; saveDB();
  render();
}
function extractContact(text){
  const em=(text.match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/)||[])[0]||'';
  const ph=(text.match(/1[3-9]\d{9}/)||[])[0]||'';
  return { email: em, phone: ph };
}
/* 脱敏确认（评分前强制弹窗） */

  <button class="btn btn-sm" onclick="closeModal()">关闭</button></div>`, 760);
}
/* ---------- 筛选结果 ---------- */
function vScreen(t){
  const done=t.candidates.filter(c=>c.scoring?.status==='done');
  const others=t.candidates.filter(c=>c.scoring?.status!=='done');
  const sorted=[...done].sort((a,b)=>b.total-a.total);

    ${sorted.map((c,i)=>`<tr>

  </div>

}
function toggleSelect(taskId,cid,on){
  const t=getTask(taskId), c=t.candidates.find(x=>x.id===cid);

}
function showEvidence(taskId,cid){
  const t=getTask(taskId), c=t.candidates.find(x=>x.id===cid); if(!c) return;
  modal(`<h3>评分证据 · ${esc(c.nameMasked)} · 综合 ${c.total} 分 <span class="mx" onclick="closeModal()">✕</span></h3>

  ${t.dims.map(d=>{const s=c.scores[d.id]; return `<div style="margin-bottom:14px">
    <div class="row"><b style="font-size:13.5px">${esc(d.name)}</b>
      <span class="badge ${s.v>=d.min?'b-green':'b-red'}">${s.v} 分 / 参考线 ${d.min}</span>

    ${s.quotes.map(q=>`<div class="quote" onclick="closeModal();showOrig('${t.id}','${c.id}',${JSON.stringify(q).replace(/"/g,'&quot;')})">「${esc(q)}」 ↗</div>`).join('')||'<div class="tabsm">未检索到原文证据</div>'}
  </div>`;}).join('')}
  ${(c.hardStatus||[]).length?`<h3 style="margin-top:8px">硬性条件核对</h3>${c.hardStatus.map(h=>`<div class="row" style="font-size:12.5px;margin:4px 0"><span class="badge ${h.status==='已满足'?'b-green':h.status==='未满足'?'b-red':'b-yellow'}">${h.status}</span><span style="color:var(--sub)">${esc(h.text)}</span></div>`).join('')}`:''}`, 800);
}
function rescore(taskId,cid){
  const t=getTask(taskId), c=t.candidates.find(x=>x.id===cid); if(!c) return;
  modal(`<h3>人工重评 · ${esc(c.nameMasked)}</h3>
  <div class="hint mb">进入面试前允许 HR 重评；旧评分将保留在历史记录中。</div>
  ${t.dims.map((d,i)=>`<div class="row" style="margin:6px 0"><span style="width:140px">${esc(d.name)}</span>
    <input type="number" min="0" max="100" id="rs${i}" value="${c.scores[d.id].v}" style="width:90px"> <span class="tabsm">（原 ${c.scores[d.id].v}）</span></div>`).join('')}
  <div class="row mt"><span class="spacer"></span><button class="btn" onclick="closeModal()">取消</button>
  <button class="btn btn-p" onclick="doRescore('${t.id}','${c.id}')">保存重评</button></div>`, 560);
}
function doRescore(taskId,cid){
  const t=getTask(taskId), c=t.candidates.find(x=>x.id===cid);
  const old={...c.scores}; let i=0;
  for(const d of t.dims){ const nv=+document.getElementById('rs'+i).value; c.scores[d.id]={...c.scores[d.id], v:Math.max(0,Math.min(100,nv)), note:'HR 人工重评'}; i++; }
  c.history.push({at:Date.now(), scores:old, total:c.total});
  const valid=t.dims.filter(d=>c.scores[d.id]);
  c.total=Math.round(valid.reduce((a,d)=>a+d.weight*c.scores[d.id].v,0)/valid.reduce((a,d)=>a+d.weight,0));
  c.matchClass = c.total>=72?{tag:'较匹配',cls:'b-green'}:c.total>=50?{tag:'部分/可迁移匹配',cls:'b-blue'}:{tag:'低匹配',cls:'b-gray'};
  saveTask(t); closeModal(); toast('已保存重评，历史评分保留','ok'); render();
}

function buildIcs(c,t){

  modal(`<h3>发件邮箱 SMTP 配置 <span class="mx" onclick="closeModal()">✕</span></h3>

  </div>

  <div class="row mt"><span class="spacer"></span>

function verifySmtp(taskId,cid){
  const user=document.getElementById('smUser').value.trim(), pass=document.getElementById('smPass').value.trim();
  if(!user||!pass) return toast('请填写邮箱与授权码','warn');
  toast('正在验证 SMTP 登录…','');
  setTimeout(()=>{
    /* 演示：本地校验格式即视为登录成功；真实版本走 SMTP 握手 */
    DB.settings.smtp={host:document.getElementById('smHost').value.trim(),port:+document.getElementById('smPort').value||465,
      user, pass:'enc:'+btoa(unescape(encodeURIComponent(pass))).slice(0,8)+'…（AES 加密）', ssl:true,
      aliases:document.getElementById('smAlias').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)};
    saveDB(); closeModal();
    toast('SMTP 登录验证通过，配置已加密保存（不写日志）','ok');
    if(taskId&&cid) openEmail(taskId,cid); else render();
  }, 900);
}

<script>
/* =====================================================
   综合评估 / 对比 / 任务设置 / 全局设置
   ===================================================== */
const EVAL_DIMS=[
  {id:'e1',name:'专业与岗位匹配',desc:'综合简历与面试证据，对岗位核心能力的判断'},
  {id:'e2',name:'沟通表达与协作',desc:'面试中的表达、倾听与协作意识'},
  {id:'e3',name:'问题解决与思维',desc:'结构化思考、拆解与解决问题的证据'},
  {id:'e4',name:'稳定性与动机',desc:'求职动机、稳定性与岗位匹配度'}];
function vEval(t){
  const cs=t.candidates.filter(c=>c.selected||c.eval);
  if(!cs.length) return `<div class="card" style="text-align:center;color:var(--sub);padding:40px">请先在「筛选结果」页勾选进入面试的候选人。</div>`;
  return cs.map(c=>{
    if(!c.eval) c.eval={scores:Object.fromEntries(EVAL_DIMS.map(d=>[d.id,{v:0,note:''}])),conflicts:[],decision:'',locked:false,archived:false};
    const e=c.eval; if(!e.locked){ genEval(t, c.id); }
    return `<div class="card">
    <div class="row"><div class="avatar">${esc(c.nameMasked[0])}</div><h3 style="margin:0">${esc(c.nameMasked)} ${c.sampleTag?'<span class="badge b-yellow">合成示例</span>':''}</h3>
      <span class="badge b-blue">简历 ${c.total} 分</span>${e.locked?'<span class="badge b-green">评估已生成并锁定</span>':'<span class="badge b-yellow">评估未生成</span>'}
      <span class="spacer"></span>
      ${!e.locked?`<button class="btn btn-sm btn-p" onclick="genEval('${t.id}','${c.id}',true)">生成综合评估</button>`:`<button class="btn btn-sm" onclick="exportEvalMd('${t.id}','${c.id}')">导出该候选人</button>`}</div>
    ${e.locked?`
    <div class="grid2 mt">
      <div><h3>证据召回（仅本候选人，不跨候选人）</h3>
        <label class="f">简历证据摘要</label>
        <div>${t.dims.map(d=>{const s=c.scores[d.id]; return `<div class="quote">〔${esc(d.name)}·${s.v}〕「${esc(s.quotes[0]||'无直接证据')}」</div>`;}).join('')}</div>
        <label class="f">面试记录（上传 PDF/DOCX/TXT 或粘贴，确认后进入评估上下文）</label>
        <textarea rows="3" placeholder="粘贴面试纪要/转写摘要" onchange="setInterview('${t.id}','${c.id}',this.value)">${esc(c.interview.text)}</textarea>
        <div class="row mt"><input type="file" accept=".pdf,.docx,.txt" onchange="upInterview('${t.id}','${c.id}',this)">
          ${c.interview.fileName?`<span class="badge b-green">已确认：${esc(c.interview.fileName)}</span>`:''}</div>
      </div>
      <div><h3>逐维度评估（HR 可改分与填写意见）</h3>
        ${EVAL_DIMS.map(d=>{const s=e.scores[d.id]; const low=s.v<25; return `<div style="margin:8px 0">
          <div class="row"><b style="width:150px;font-size:13px">${esc(d.name)}</b>
            <input type="number" min="0" max="100" value="${s.v}" style="width:80px" onchange="setEval('${t.id}','${c.id}','${d.id}','v',+this.value)">
            ${low&&s._low?'<span class="badge b-yellow">低置信度暂估 0–24</span>':''}</div>
          <input type="text" placeholder="HR 意见 / 证据说明" value="${esc(s.note)}" style="margin-top:4px" onchange="setEval('${t.id}','${c.id}','${d.id}','note',this.value)">
        </div>`;}).join('')}
        <div class="warnbox">证据不足的维度给出 <b>0–24 分低置信度暂估</b>并标注；简历与面试证据<b>冲突</b>的项标红，由 HR 核实后改判：
          ${(e.conflicts||[]).map(x=>`<div style="color:#fca5a5">· ${esc(x)}</div>`).join('')||'<div class="tabsm">未检出冲突</div>'}</div>
        <label class="f">结论</label>
        <select onchange="setEval('${t.id}','${c.id}','decision',this.value)">
          <option value="">选择结论</option>
          <option value="进入下一轮" ${e.decision==='进入下一轮'?'selected':''}>进入下一轮</option>
          <option value="补充信息" ${e.decision==='补充信息'?'selected':''}>补充信息</option>
          <option value="不推进" ${e.decision==='不推进'?'selected':''}>不推进</option></select>
        <div class="row mt"><button class="btn btn-ok btn-sm" ${e.decision?'':'disabled'} onclick="archiveEval('${t.id}','${c.id}')">确认并归档</button>
          ${e.archived?'<span class="badge b-green">已归档 ✓</span>':''}</div>
      </div>
    </div>`:''}
  </div>`;}).join('');
}
function genEval(task,cid,toastFlag){
  if(typeof task==='string') task=getTask(task);
  const c=task.candidates.find(x=>x.id===cid); if(!c) return;
  if(!c.eval) c.eval={scores:{},conflicts:[],decision:'',locked:false,archived:false};
  const iv=c.interview.text||'';
  if(!c.eval.locked){
    for(const d of EVAL_DIMS){
      const kws={'e1':t.dims[0]?.keywords||[],'e2':['沟通','表达','协作','倾听'],'e3':['问题','拆解','方案','思路','逻辑'],'e4':['动机','稳定','规划','离职']}[d.id];
      const sents=splitSents(iv); const hits=kws.filter(k=>new RegExp(escRe(k),'i').test(iv));
      const quotes=hits.map(k=>sents.find(s=>new RegExp(escRe(k),'i').test(s))).filter(Boolean).slice(0,2);
      let v,low=false;
      if(hits.length>=2) v=Math.min(100, 45+hits.length*14);
      else if(hits.length===1) v=35;
      else { v=15; low=true; }   /* 证据不足：0–24 低置信度暂估 */
      c.eval.scores[d.id]={v,note: low?'证据不足，暂估分，请结合面试追问核实':'基于面试记录证据',quotes,_low:low};
      if(low && !c.eval.conflicts.some(x=>x.includes(d.name))) c.eval.conflicts.push(d.name+'：面试记录中证据不足，低置信度暂估，请核实');
      if(!iv && !c.eval.conflicts.some(x=>x.includes('未上传'))) c.eval.conflicts.push('尚未上传/粘贴面试记录，全部维度为低置信度暂估');
    }
    c.eval.locked=true; saveDB();
    if(toastFlag){ toast('综合评估已生成（首份生成后维度锁定）','ok'); render(); }
  }
}
function setInterview(taskId,cid,v){ const c=getTask(taskId).candidates.find(x=>x.id===cid); c.interview.text=v; c.eval.locked=false; c.eval.conflicts=[]; saveDB(); toast('面试记录已更新，评估将重新生成','ok'); render(); }
function upInterview(taskId,cid,input){
  const c=getTask(taskId).candidates.find(x=>x.id===cid); const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ let tx=rd.result;
    if(f.name.endsWith('.pdf')&&window.pdfjsLib){ /* 简化：提示粘贴 */ toast('PDF 请复制关键内容粘贴，以进入评估上下文','warn'); render(); return; }
    c.interview={text:String(tx).slice(0,4000), fileName:f.name}; c.eval={scores:{},conflicts:[],decision:'',locked:false,archived:false};
    saveDB(); toast('面试材料已确认并进入评估上下文','ok'); render(); };
  if(/\.txt$/i.test(f.name)) rd.readAsText(f,'utf-8'); else { toast('DOCX/PDF 请粘贴文字内容（演示环境直接读 txt）','warn'); }
}
function setEval(taskId,cid,dim,k,v){
  const c=getTask(taskId).candidates.find(x=>x.id===cid);
  if(dim==='decision'){ c.eval.decision=v; } else if(k==='v'){ c.eval.scores[dim].v=v; c.eval.scores[dim]._low=false; } else c.eval.scores[dim].note=v;
  saveDB();
}
function archiveEval(taskId,cid){
  const t=getTask(taskId), c=t.candidates.find(x=>x.id===cid);
  c.eval.archived=true; const r=saveTask(t);
  if(r===409) return toast('版本冲突（409）：该任务已在其他窗口修改，请刷新后重试','bad');
  toast('评估已确认并归档','ok'); render();
}

/* ---------- 候选人对比 ---------- */
function vCompare(t){
  const cs=t.candidates.filter(c=>c.scoring?.status==='done');
  if(cs.length<2) return `<div class="card" style="text-align:center;color:var(--sub);padding:40px">至少需要 2 位已评分候选人才能对比（当前 ${cs.length}）。</div>`;
  const groups={'已满足':[],'待核实':[],'未满足':[]};
  for(const c of cs){ const bad=(c.hardStatus||[]).some(h=>h.status==='未满足');
    const pend=(c.hardStatus||[]).some(h=>h.status!=='已满足');
    (bad?groups['未满足']:pend?groups['待核实']:groups['已满足']).push(c); }
  return `<div class="card"><h3>硬性条件分组 × 加权总分对比 <span class="tabsm">（分组后比总分，仅提示风险，不做淘汰）</span></h3>
  ${Object.entries(groups).filter(([,v])=>v.length).map(([g,list])=>{
    const sorted=[...list].sort((a,b)=>b.total-a.total);
    return `<div class="grp-head" style="background:${g==='已满足'?'rgba(52,211,153,.1)':g==='待核实'?'rgba(251,191,36,.1)':'rgba(248,113,113,.1)'}">
      <span class="badge ${g==='已满足'?'b-green':g==='待核实'?'b-yellow':'b-red'}">${g}</span> ${list.length} 人</div>
    <table class="tbl"><tr><th>排序</th><th>候选人</th><th>加权总分</th><th>逐维度</th><th>风险提示</th><th>硬性条件明细</th></tr>
    ${sorted.map((c,i)=>{const below=t.dims.filter(d=>c.scores[d.id].v<d.min);
      return `<tr><td class="tabsm">#${i+1}</td><td><b>${esc(c.nameMasked)}</b></td>
      <td><b style="font-size:15px">${c.total}</b> <span class="badge ${c.matchClass.cls}">${c.matchClass.tag}</span></td>
      <td style="min-width:200px">${t.dims.map(d=>`<div class="sbar"><span class="nm">${esc(d.name)}</span><div class="pbar"><i style="width:${c.scores[d.id].v}%;${c.scores[d.id].v<d.min?'background:var(--bad)':''}"></i></div><span class="vv">${c.scores[d.id].v}</span></div>`).join('')}</td>
      <td class="tabsm">${below.length?`⚠ ${below.map(d=>esc(d.name)+'('+c.scores[d.id].v+'<'+d.min+')').join('、')} 低于参考线`:'<span style="color:var(--ok)">无低于参考线维度</span>'}
        ${(c.hardStatus||[]).some(h=>h.status==='待核实')?'<br>⚠ 存在待核实的硬性条件':''}</td>
      <td class="tabsm">${(c.hardStatus||[]).map(h=>`<span class="badge ${h.status==='已满足'?'b-green':h.status==='未满足'?'b-red':'b-yellow'}" style="margin:1px">${h.status}</span>`).join('')}</td></tr>`;}).join('')}</table>`;
  }).join('')}</div>`;
}

function genLink(taskId){ const t=getTask(taskId); (t.accessLinks=t.accessLinks||[]).push({token:Math.random().toString(36).slice(2,12), revoked:false, at:Date.now()}); saveDB(); toast('访问链接已生成','ok'); render(); }
function revokeLink(taskId,token){ const t=getTask(taskId); const l=t.accessLinks.find(x=>x.token===token); if(l) l.revoked=true; saveDB(); toast('链接已撤销，立即失效','ok'); render(); }
function archiveTask(id){ const t=getTask(id); t.status='archived'; t.archivedAt=Date.now(); saveDB(); toast('已归档，可在「归档」页恢复或删除','ok'); render(); }

/* ---------- Markdown 导出 ---------- */
function exportMd(taskId){
  const t=getTask(taskId);
  let md=`# HireLens 招聘任务：${t.name}\n\n> 导出时间：${new Date().toLocaleString('zh-CN')} · 版本 v${t.ver} · 本文件由 HireLens 生成\n\n## 一、岗位与初筛标准\n\n- 岗位：${t.jdParsed?.title||'-'}（${t.jdParsed?.level||'-'}）\n- 初筛维度：\n\n| 维度 | 说明 | 权重 | 最低参考线 |\n|---|---|---|---|\n`;
  md+=t.dims.map(d=>`| ${d.name} | ${d.desc} | ${d.weight}% | ${d.min} |`).join('\n');
  md+=`\n\n## 二、候选人评估明细\n`;
  for(const c of t.candidates){
    md+=`\n### ${c.nameMasked}${c.sampleTag?'（合成示例）':''}\n\n`;
    if(c.scoring?.status==='done'){
      md+=`- 简历总分：**${c.total}**（${c.matchClass.tag}）\n- 硬性条件：${(c.hardStatus||[]).map(h=>`${h.status}〔${h.text}〕`).join('；')||'-'}\n`;
      for(const d of t.dims){ const s=c.scores[d.id];
        md+=`- ${d.name}：${s.v} 分（参考线 ${d.min}）${s.note?`，备注：${s.note}`:''}\n`;
        for(const q of s.quotes) md+=`  - 证据：「${q}」\n`; }
      md+=`- 人工审核：${c.manual.level||'未评级'} ${c.manual.note?'（'+c.manual.note+'）':''}\n`;
      md+=`- 电话：${c.phone.num||'-'} · 结果：${c.phone.result||'-'} ${c.phone.note?'（'+c.phone.note+'）':''}\n`;
      if(c.meeting.mid) md+=`- 面试会议：${c.meeting.mid} · ${c.meeting.link}${c.meeting.transcript?'（纪要转写已开启）':''}\n`;
      if(c.email.status!=='未发送') md+=`- 邀约邮件：${c.email.status} → ${c.email.to||'-'} · 面试日期 ${c.email.date||'-'}\n`;
      if(c.eval&&c.eval.locked){
        md+=`- 综合评估：${EVAL_DIMS.map(d=>`${d.name} ${c.eval.scores[d.id].v}`).join('；')}\n`;
        md+=`- 评估结论：${c.eval.decision||'未填写'}${c.eval.archived?'（已归档）':''}\n`;
        if(c.eval.conflicts.length) md+=`- 待核实/冲突：${c.eval.conflicts.join('；')}\n`;
      }
    } else md+=`- 评分状态：${c.scoring?.status||'queued'}${c.scoring?.reason?'（'+c.scoring.reason+'）':''}\n`;
  }
  md+=`\n---\n*提示：本报告所有候选人信息均为脱敏版本；null 表示材料不可读/信息冲突，不计入总分。*\n`;
  download(`${t.name}_HireLens报告.md`, md, 'text/markdown');
  toast('Markdown 报告已导出','ok');
}
function exportEvalMd(taskId,cid){ exportMd(taskId); }
